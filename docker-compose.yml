services:
  mysql:
    image: mysql:8.0
    container_name: jingcaixing-mysql
    environment:
      MYSQL_DATABASE: jingcaixing
      MYSQL_USER: jingcaixing
      MYSQL_PASSWORD: change_me
      MYSQL_ROOT_PASSWORD: root_change_me
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
volumes:
  mysql_data:
